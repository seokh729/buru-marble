<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>부루마블 - 가족 세계여행 보드게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --felt:#13342a;
  --felt-dark:#0c231c;
  --board:#f6efdd;
  --board-line:#d8c9a0;
  --ink:#241c10;
  --gold:#d4a62a;
  --gold-light:#f0cf6a;
  --cream:#fffaf0;
  --danger:#c0392b;
  --accent:#1B3A5C;
  --p0:#e74c3c; --p1:#2980b9; --p2:#27ae60; --p3:#f1c40f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"PretendardVariable",-apple-system,"Noto Sans KR",sans-serif;
  background:radial-gradient(ellipse at top, var(--felt) 0%, var(--felt-dark) 70%);
  color:var(--cream);
  min-height:100vh;
  word-break:keep-all;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;}
.hidden{display:none !important;}
img,svg{max-width:100%;}

/* ---------- layout shells ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;gap:14px;}

/* ---------- setup screen ---------- */
.setup-wrap{width:100%;max-width:760px;background:rgba(255,255,255,0.03);border:1px solid rgba(212,166,42,0.35);border-radius:18px;padding:24px;}
.setup-title{text-align:center;margin-bottom:4px;}
.setup-title h1{font-size:2.1rem;margin:0;color:var(--gold-light);letter-spacing:1px;}
.setup-title p{margin:6px 0 20px;text-align:center;color:#cfd8c9;font-size:0.92rem;}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
.preset-btn{flex:1;min-width:110px;background:rgba(212,166,42,0.12);border:1px solid var(--gold);color:var(--gold-light);padding:12px 8px;border-radius:12px;cursor:pointer;font-weight:600;font-size:0.95rem;transition:.15s;}
.preset-btn:hover{background:rgba(212,166,42,0.28);}
.preset-sub{display:block;font-size:0.72rem;font-weight:400;color:#cfd8c9;margin-top:2px;}
.mode-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
.mode-btn.active{background:rgba(212,166,42,0.32);box-shadow:0 0 0 2px var(--gold);}

.player-slot{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.22);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--p0);}
.player-slot.off{opacity:0.45;}
.slot-token{font-size:1.6rem;width:38px;text-align:center;flex:none;}
.slot-toggle{flex:none;}
.slot-toggle button{background:none;border:1px solid rgba(255,255,255,0.3);color:var(--cream);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:0.82rem;}
.slot-toggle button.on{background:var(--gold);color:#1a1300;border-color:var(--gold);}
.slot-name{flex:1;min-width:70px;}
.slot-name input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--cream);padding:7px 8px;font-size:0.9rem;}
.slot-type{display:flex;gap:4px;flex:none;}
.slot-type button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#dfe7da;border-radius:8px;padding:6px 9px;font-size:0.8rem;cursor:pointer;}
.slot-type button.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.setup-options{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0;}
.opt-group{flex:1;min-width:150px;}
.opt-group label{display:block;font-size:0.8rem;color:#cfd8c9;margin-bottom:4px;}
.opt-group select{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:var(--cream);}

.setup-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.btn-main{flex:2;min-width:160px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1300;border:none;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:700;cursor:pointer;}
.btn-main:disabled{opacity:0.4;cursor:not-allowed;}
.btn-ghost{flex:1;min-width:120px;background:transparent;border:1px solid rgba(255,255,255,0.3);color:var(--cream);border-radius:12px;padding:14px;font-size:0.95rem;cursor:pointer;}
.setup-warn{text-align:center;color:#ffb199;font-size:0.84rem;min-height:1.2em;margin-top:6px;}

/* ---------- game screen ---------- */
#gameScreen{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:12px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(0,0,0,0.25);border-radius:14px;padding:10px 16px;}
.topbar h2{margin:0;font-size:1.1rem;color:var(--gold-light);}
.topbar .tbtns{display:flex;gap:6px;}
.topbar button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:var(--cream);padding:7px 12px;border-radius:8px;font-size:0.82rem;cursor:pointer;}
.topbar button:hover{background:rgba(255,255,255,0.18);}

.main-layout{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
.board-wrap{flex:none;width:100%;max-width:720px;aspect-ratio:1/1;}
.board{
  display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);
  width:100%;height:100%;background:var(--board);border-radius:10px;
  border:4px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,0.5);position:relative;
}
.tile{position:relative;border:1px solid var(--board-line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;background:var(--board);padding:2px;cursor:default;}
.tile.corner{display:flex;align-items:center;justify-content:center;background:#efe4bf;}
.tile .band{position:absolute;top:0;left:0;right:0;height:24%;}
.tile .ic{font-size:1.1rem;line-height:1;margin-bottom:1px;}
.tile .nm{font-size:0.62rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.08;max-width:96%;}
.tile .pr{font-size:0.52rem;font-weight:600;color:#444;margin-top:1px;}
.tile.corner .nm{font-size:0.74rem;}
.tile.owned{box-shadow:inset 0 0 0 2px var(--owner-color,transparent);}
.tile .lvbadge{position:absolute;bottom:1px;right:1px;font-size:0.5rem;background:rgba(0,0,0,0.65);color:#fff;border-radius:3px;padding:0 2px;}
.tile .mortbadge{position:absolute;top:26%;left:1px;font-size:0.48rem;background:#8e2f2f;color:#fff;border-radius:3px;padding:0 2px;}
.tokens-layer{position:absolute;inset:0;pointer-events:none;}
.token{position:absolute;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,0.55);transition:left .16s ease-out,top .16s ease-out;z-index:5;}
@keyframes tokenHop{0%{transform:translateY(0) scale(1);}45%{transform:translateY(-55%) scale(1.2);}100%{transform:translateY(0) scale(1);}}
.token.hop{animation:tokenHop .16s ease-out;}

.center-area{position:absolute;top:9.1%;left:9.1%;width:81.8%;height:81.8%;grid-column:2/11;grid-row:2/11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:repeating-linear-gradient(135deg,#efe4bf,#efe4bf 14px,#e8dcac 14px,#e8dcac 28px);border:2px dashed var(--gold);border-radius:8px;padding:10px;}
.logo-mark{font-size:1.4rem;font-weight:800;color:#5a3d12;letter-spacing:2px;}
.dice-row{display:flex;gap:8px;}
.die{width:38px;height:38px;background:#fff;border-radius:7px;border:2px solid #333;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;box-shadow:0 2px 6px rgba(0,0,0,0.3);transition:transform .09s linear;}
.die i{border-radius:50%;background:transparent;}
.die i.on{background:#222;}
.roll-btn{background:linear-gradient(135deg,var(--gold-light),var(--gold));border:none;border-radius:10px;padding:10px 22px;font-weight:700;color:#1a1300;cursor:pointer;font-size:0.95rem;}
.roll-btn:disabled{opacity:0.35;cursor:not-allowed;}
.turn-banner{font-size:0.82rem;background:rgba(27,58,92,0.85);color:#fff;padding:6px 12px;border-radius:20px;text-align:center;max-width:90%;}
.end-turn-btn{background:rgba(0,0,0,0.3);border:1px solid var(--gold);color:var(--gold-light);padding:8px 16px;border-radius:9px;cursor:pointer;font-size:0.85rem;}
.log-box{width:92%;max-height:70px;overflow-y:auto;font-size:0.66rem;background:rgba(255,255,255,0.5);border-radius:6px;padding:4px 7px;color:#3a2f16;line-height:1.5;}
.log-box div{border-bottom:1px solid rgba(0,0,0,0.06);padding:1px 0;}

/* side panel */
.side-panel{flex:1;min-width:280px;display:flex;flex-direction:column;gap:10px;}
.pcard{background:rgba(255,255,255,0.05);border-radius:12px;padding:10px 12px;border-left:5px solid #888;transition:.2s;}
.pcard.current{background:rgba(212,166,42,0.18);box-shadow:0 0 0 2px var(--gold);}
.pcard.bankrupt{opacity:0.4;}
.pcard .pc-head{display:flex;align-items:center;gap:8px;}
.pcard .pc-token{font-size:1.3rem;}
.pcard .pc-name{font-weight:700;flex:1;font-size:0.92rem;}
.pcard .pc-badge{font-size:0.65rem;background:rgba(0,0,0,0.3);border-radius:8px;padding:2px 7px;}
.pcard .pc-cash{font-size:1.15rem;font-weight:800;color:var(--gold-light);margin:4px 0 2px;}
.pcard .pc-meta{font-size:0.72rem;color:#c9d2c3;}
.pc-props{margin-top:6px;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
.pc-prop-row{display:flex;align-items:center;gap:6px;font-size:0.72rem;background:rgba(0,0,0,0.18);border-radius:6px;padding:4px 6px;}
.pc-prop-row .pr-name{flex:1;}
.pc-prop-row button{font-size:0.62rem;padding:3px 6px;border-radius:5px;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;cursor:pointer;}
.pc-prop-row button:disabled{opacity:0.3;cursor:not-allowed;}
.pc-prop-row .swatch{width:8px;height:8px;border-radius:2px;flex:none;}
.toggle-props{font-size:0.7rem;color:var(--gold-light);cursor:pointer;margin-top:4px;text-align:center;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--cream);color:var(--ink);border-radius:14px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.modal h3{margin:0 0 10px;color:#5a3d12;font-size:1.1rem;}
.modal p{font-size:0.88rem;line-height:1.6;margin:6px 0;}
.modal .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.modal button{flex:1;min-width:100px;padding:10px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:0.88rem;}
.modal button.primary{background:var(--accent);color:#fff;}
.modal button.good{background:#27ae60;color:#fff;}
.modal button.bad{background:var(--danger);color:#fff;}
.modal button.neutral{background:#e0d9c0;color:#3a2f16;}
.card-face{background:linear-gradient(135deg,var(--gold-light),var(--gold));border-radius:10px;padding:16px;text-align:center;margin-bottom:12px;}
.card-face .cf-ic{font-size:2rem;}
.card-face .cf-txt{font-weight:700;color:#1a1300;margin-top:6px;}
.dest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;max-height:280px;overflow-y:auto;}
.dest-grid button{background:#fff;border:1px solid #d8c9a0;border-radius:8px;padding:8px 4px;font-size:0.72rem;color:#3a2f16;cursor:pointer;text-align:center;}
.dest-grid button:hover{background:#f0e6c8;}
.rules-body h4{color:#5a3d12;margin:14px 0 4px;}
.rules-body ul{padding-left:18px;margin:4px 0;}
.rules-body li{font-size:0.84rem;margin-bottom:3px;}

.gameover-rank{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.05);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.gameover-rank .rk{font-weight:800;font-size:1.1rem;width:26px;}

@media (max-width:760px){
  .tile .nm{font-size:0.5rem;}
  .tile .pr{font-size:0.4rem;}
  .tile.corner .nm{font-size:0.6rem;}
  .die{width:30px;height:30px;}
  .logo-mark{font-size:1rem;}
  .player-slot{flex-wrap:wrap;row-gap:8px;}
  .slot-name{flex-basis:100%;order:5;min-width:0;}
}
</style>
</head>
<body>
<div id="app">

<!-- ============ SETUP SCREEN ============ -->
<div class="setup-wrap" id="setupScreen">
  <div class="setup-title">
    <h1>🌍 부루마블</h1>
    <p>가족과 함께 떠나는 세계여행 보드게임 · 1인 ~ 4인용</p>
  </div>

  <div class="mode-row">
    <button class="preset-btn mode-btn active" id="modeLocalBtn">📱 한 기기로 같이하기<span class="preset-sub">폰 하나 돌려가며 플레이</span></button>
    <button class="preset-btn mode-btn" id="modeOnlineBtn">🌐 각자 폰으로 하기<span class="preset-sub">방 코드로 실시간 연결</span></button>
  </div>

  <div id="onlineSubRow" class="mode-row hidden">
    <button class="preset-btn" id="onlineHostBtn">🏠 방 만들기<span class="preset-sub">내가 방장이 돼요</span></button>
    <button class="preset-btn" id="onlineJoinBtn">🔑 방 참가하기<span class="preset-sub">방 코드로 들어가요</span></button>
  </div>

  <div id="joinCodeBox" class="hidden">
    <div class="opt-group">
      <label>방 코드 (5자리)</label>
      <input id="joinCodeInput" maxlength="5" placeholder="예: AB3K9" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:var(--cream);font-size:1.1rem;text-align:center;letter-spacing:4px;text-transform:uppercase;">
    </div>
    <div class="opt-group">
      <label>내 이름</label>
      <input id="joinNameInput" maxlength="8" placeholder="내 이름" style="width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:var(--cream);font-size:0.95rem;">
    </div>
    <div class="setup-warn" id="joinWarn"></div>
    <button class="btn-main" id="joinSubmitBtn" style="width:100%;margin-top:6px;">참가하기</button>
  </div>

  <div id="configBody">
    <div class="preset-row">
      <button class="preset-btn" data-preset="1">1인용<span class="preset-sub">나 vs 컴퓨터 1명</span></button>
      <button class="preset-btn" data-preset="2">2인용<span class="preset-sub">가족 2명</span></button>
      <button class="preset-btn" data-preset="3">3인용<span class="preset-sub">가족 3명</span></button>
      <button class="preset-btn" data-preset="4">4인용<span class="preset-sub">가족 4명</span></button>
    </div>

    <div id="playerSlots"></div>

    <div class="setup-options">
      <div class="opt-group">
        <label>시작 자금</label>
        <select id="optCash">
          <option value="10000000">1,000만원 (빠른 게임)</option>
          <option value="15000000" selected>1,500만원 (기본)</option>
          <option value="20000000">2,000만원 (여유있게)</option>
        </select>
      </div>
      <div class="opt-group">
        <label>게임 길이</label>
        <select id="optLaps">
          <option value="0">무제한 (파산자 가릴 때까지)</option>
          <option value="20">20바퀴 후 자산 비교</option>
          <option value="30" selected>30바퀴 후 자산 비교</option>
          <option value="40">40바퀴 후 자산 비교</option>
        </select>
      </div>
    </div>
  </div>

  <div class="setup-warn" id="setupWarn"></div>
  <div class="setup-actions" id="setupActionsRow">
    <button class="btn-main" id="startBtn">게임 시작</button>
    <button class="btn-ghost" id="continueBtn">이어서 하기</button>
    <button class="btn-ghost" id="rulesBtnSetup">게임 규칙 보기</button>
  </div>
</div>

<!-- ============ LOBBY SCREEN (online mode waiting room) ============ -->
<div class="setup-wrap hidden" id="lobbyScreen">
  <div class="setup-title">
    <h1>🌍 대기실</h1>
    <p>가족에게 아래 방 코드를 알려주고, 각자 폰에서 "각자 폰으로 하기 → 방 참가하기"로 들어오게 하세요.</p>
  </div>
  <div id="roomCodeDisplay" style="text-align:center;font-size:2.4rem;font-weight:800;letter-spacing:10px;color:var(--gold-light);background:rgba(0,0,0,0.25);border-radius:12px;padding:14px;margin-bottom:16px;"></div>
  <div id="lobbySeats"></div>
  <div class="setup-actions" style="margin-top:16px;">
    <button class="btn-main hidden" id="lobbyStartBtn">게임 시작</button>
    <div class="setup-warn hidden" id="lobbyGuestMsg" style="color:#cfd8c9;">방장이 게임을 시작하길 기다리는 중…</div>
    <button class="btn-ghost" id="lobbyLeaveBtn">나가기</button>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="gameScreen" class="hidden">
  <div class="topbar">
    <h2>🌍 부루마블</h2>
    <div class="tbtns">
      <button id="rulesBtnGame">📖 규칙</button>
      <button id="newGameBtn">🔄 새 게임</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="board-wrap">
      <div class="board" id="board">
        <div class="center-area">
          <div class="logo-mark">BURU MARBLE</div>
          <div class="turn-banner" id="turnBanner">게임을 준비하고 있습니다…</div>
          <div class="dice-row" id="diceRow">
            <div class="die" id="die0"></div>
            <div class="die" id="die1"></div>
          </div>
          <button class="roll-btn" id="rollBtn">🎲 주사위 굴리기</button>
          <button class="end-turn-btn hidden" id="endTurnBtn">턴 종료 ▶</button>
          <div class="log-box" id="logBox"></div>
        </div>
        <div class="tokens-layer" id="tokensLayer"></div>
      </div>
    </div>

    <div class="side-panel" id="sidePanel"></div>
  </div>
</div>

</div>

<!-- generic modal root -->
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

/* =========================================================
   FIREBASE (online multiplayer — room-code based, no login)
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDI7uISLpgWd4vmi9hQy-lFV6TrwrvWhCY",
  authDomain: "buru-marble.firebaseapp.com",
  databaseURL: "https://buru-marble-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "buru-marble",
};
const fbApp = initializeApp(firebaseConfig);
const fbDb = getDatabase(fbApp);
const ROOM_KEY = 'burumarble_room_v1';

function getClientId(){
  let id = localStorage.getItem('burumarble_client_id');
  if(!id){ id = 'c'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('burumarble_client_id', id); }
  return id;
}
const MY_CLIENT_ID = getClientId();

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function canIControl(p){
  return !!p && p.human && (!G || !G.online || p.clientId===MY_CLIENT_ID);
}
function isHost(){
  return !G || !G.online || G.hostClientId===MY_CLIENT_ID;
}

/* =========================================================
   DATA
========================================================= */
const FMT = n => '₩' + Math.round(n).toLocaleString('ko-KR');

const GROUPS = [
  {id:1,name:'아시아',color:'#8B5E3C'},
  {id:2,name:'동남아시아',color:'#2FB4D1'},
  {id:3,name:'중동·인도',color:'#D6378C'},
  {id:4,name:'아프리카',color:'#F2994A'},

function freshDeck(){

  for(let i=d.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [d[i],d[j]]=[d[j],d[i]]; }
  return d;
}

function newTileState(){
  return TILES.map(t=>{
    if(t.type==='city'||t.type==='airport'||t.type==='utility'){
      return {owner:null, level:0, mortgaged:false, landmark:false};
    }
    return null;
  });

/* =========================================================
   PLAYER / BOARD HELPERS
========================================================= */
function activePlayers(){ return G.players.filter(p=>!p.bankrupt); }
function currentPlayer(){ return G.players[G.turnIdx]; }
function groupOf(gid){ return GROUPS.find(g=>g.id===gid); }
function groupTiles(gid){ return TILES.map((t,i)=>({t,i})).filter(x=>x.t.group===gid).map(x=>x.i); }
function ownsFullGroup(player, gid){
  return groupTiles(gid).every(i=>G.tileState[i].owner===player.id);
}
function countBuildings(player){
  let c=0;
  G.tileState.forEach((ts,i)=>{ if(ts && ts.owner===player.id){ c+=ts.level; if(ts.landmark) c+=1; } });
  return c;
}
function propertyValue(ts, tile){
  if(!ts || !ts.owner) return 0;
  if(ts.mortgaged) return tile.price*MORTGAGE_RATE;
  let v = tile.price*(1+ts.level*0.5);
  if(ts.landmark) v += tile.price*1.0;
  return v;
}
function netWorth(player){
  let v = player.cash;
  G.tileState.forEach((ts,i)=>{ if(ts && ts.owner===player.id){ v += propertyValue(ts, TILES[i]); } });
  return v;
}
function ownerOf(idx){
  const ts = G.tileState[idx];
  if(!ts || ts.owner==null) return null;
  return G.players.find(p=>p.id===ts.owner);
}
function playerOwnedAirports(player){
  return TILES.map((t,i)=>({t,i})).filter(x=>x.t.type==='airport' && G.tileState[x.i].owner===player.id && !G.tileState[x.i].mortgaged).length;
}
function playerOwnedUtilities(player){
  return TILES.map((t,i)=>({t,i})).filter(x=>x.t.type==='utility' && G.tileState[x.i].owner===player.id && !G.tileState[x.i].mortgaged).length;
}

/* =========================================================
   ONLINE MULTIPLAYER (Firebase Realtime DB, room-code based)
========================================================= */
let roomUnsub = null;
let aiDriveLock = false;

/* Stored as a single JSON string blob (not a native RTDB tree) — RTDB silently
   drops empty arrays and treats null array elements as deleted keys, which
   corrupts tileState/logs/deck if stored as nested objects. A string sidesteps
   all of that. */
function stateRef(code){ return ref(fbDb, 'rooms/'+code+'/stateJson'); }

let writeSeq = 0;
let lastSentWriterTag = null;
function pushState(){
  if(!G || !G.online || !G.roomCode) return;
  const tag = MY_CLIENT_ID+':'+(++writeSeq);
  lastSentWriterTag = tag;
  G.__writer = tag;
  set(stateRef(G.roomCode), JSON.stringify(G)).catch(e=>console.error('sync error', e));
}

async function fetchRoomState(code){
  const snap = await get(stateRef(code));
  if(!snap.exists()) return null;
  try{ return JSON.parse(snap.val()); }catch(e){ return null; }
}

async function generateUniqueRoomCode(){
  for(let i=0;i<5;i++){
    const code = genRoomCode();
    const existing = await fetchRoomState(code);
    if(!existing) return code;
  }
  return genRoomCode()+Date.now().toString(36).slice(-2);
}

async function createRoom(active){
  const cash = +document.getElementById('optCash').value;
  const laps = +document.getElementById('optLaps').value;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('setupWarn').textContent = '방을 만드는 중…';
  const code = await generateUniqueRoomCode();
  G = buildInitialState(active, cash, laps);
  G.online = true;
  G.roomCode = code;
  G.hostClientId = MY_CLIENT_ID;
  G.started = false;
  const mySlot = G.players.find(p=>p.human);
  if(mySlot) mySlot.clientId = MY_CLIENT_ID;
  localStorage.setItem(ROOM_KEY, code);
  document.getElementById('startBtn').disabled = false;
  await set(stateRef(code), JSON.stringify(G));
  subscribeRoom(code);
}

async function joinRoom(code, name, silent){
  const remote = await fetchRoomState(code);
  if(!remote){
    if(!silent) document.getElementById('joinWarn').textContent = '방을 찾을 수 없어요. 코드를 다시 확인해주세요.';
    else localStorage.removeItem(ROOM_KEY);
    return;
  }
  G = remote;
  G.roomCode = code;
  localStorage.setItem(ROOM_KEY, code);
  // reconnect: do I already own a seat?
  const mine = G.players.find(p=>p.clientId===MY_CLIENT_ID);
  if(!mine && !G.started){
    const openSeat = G.players.find(p=>p.human && !p.clientId);
    if(openSeat){
      openSeat.clientId = MY_CLIENT_ID;
      openSeat.name = name || openSeat.name;
      await set(stateRef(code), JSON.stringify(G));
    } else if(!silent){
      document.getElementById('joinWarn').textContent = '이 방은 이미 자리가 다 찼어요.';
      return;
    }
  }
  subscribeRoom(code);
}

function subscribeRoom(code){
  if(roomUnsub){ roomUnsub(); roomUnsub=null; }
  roomUnsub = onValue(stateRef(code), snap=>{
    if(!snap.exists()){ return; }
    let parsed;
    try{ parsed = JSON.parse(snap.val()); }catch(e){ return; }
    if(parsed.__writer && parsed.__writer===lastSentWriterTag){ return; } // our own echo — already applied locally, don't detach in-flight refs
    G = parsed;
    G.roomCode = code;
    if(G.started){
      if(document.getElementById('gameScreen').classList.contains('hidden')){
        showGameScreen();
        renderBoardOnce();
      }
      renderAll(true);
      maybeDriveTurn();
    } else {
      renderLobby();
    }
  });
}

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('lobbyScreen').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').textContent = G.roomCode;
  const seatsRoot = document.getElementById('lobbySeats');
  seatsRoot.innerHTML = G.players.map((p,i)=>{
    const mine = p.clientId===MY_CLIENT_ID;
    let status;
    if(!p.human) status = '🤖 컴퓨터';
    else if(p.clientId) status = mine ? `✅ 나 (${p.name})` : `✅ ${p.name} 참가완료`;

  }).join('');

function maybeDriveTurn(){
  if(!G || G.phase==='gameover' || !G.started) return;
  const p = currentPlayer();
  if(!p || p.bankrupt) return;
  if(p.inIsland){
    if(canIControl(p)) showIslandModal(p);
    else if(!p.human && isHost() && !aiDriveLock){
      aiDriveLock = true;
      (async()=>{ await sleep(400); await aiHandleIsland(p); aiDriveLock=false; })();
    }
    return;
  }
  if(!p.human && isHost() && G.phase==='idle' && !aiDriveLock){
    aiDriveLock = true;
    (async()=>{ await sleep(500); await aiTakeTurn(p); aiDriveLock=false; })();
  }
}

/* =========================================================
   BOARD RENDER (static tiles, built once per game)
========================================================= */
function tileGridPos(i){
  if(i===0) return {row:11,col:11};
  if(i>=1&&i<=9) return {row:11,col:11-i};
  if(i===10) return {row:11,col:1};
  if(i>=11&&i<=19) return {row:11-(i-10),col:1};
  if(i===20) return {row:1,col:1};
  if(i>=21&&i<=29) return {row:1,col:1+(i-20)};
  if(i===30) return {row:1,col:11};
  return {row:1+(i-30),col:11};
}

function renderBoardOnce(){
  const board = document.getElementById('board');
  // remove old tiles (keep center-area and tokens-layer)
  board.querySelectorAll('.tile').forEach(e=>e.remove());
  TILES.forEach((t,i)=>{
    const pos = tileGridPos(i);
    const div = document.createElement('div');
    div.className = 'tile' + (['go','island','worldtour','socialfund'].includes(t.type)?' corner':'');
    div.style.gridRow = pos.row; div.style.gridColumn = pos.col;
    div.dataset.idx = i;
    let bandColor = null;
    if(t.type==='city') bandColor = groupOf(t.group).color;
    if(t.type==='airport') bandColor = '#999';
    if(t.type==='utility') bandColor = '#bbb';
    if(t.type==='chance') bandColor = '#d4a62a';
    if(t.type==='tax') bandColor = '#a33';
    let html = '';
    if(bandColor) html += `<div class="band" style="background:${bandColor}"></div>`;
    html += `<div class="ic">${t.icon}</div><div class="nm">${t.name}</div>`;
    if(t.price) html += `<div class="pr">${(t.price/10000).toLocaleString()}만</div>`;
    div.innerHTML = html;
    if(t.type==='city'||t.type==='airport'||t.type==='utility'){
      div.addEventListener('click', ()=>showTileInfo(i));
    }
    board.appendChild(div);
  });
}

function refreshTileVisuals(){
  document.querySelectorAll('.tile').forEach(div=>{
    const i = +div.dataset.idx;
    const ts = G.tileState[i];
    div.querySelectorAll('.lvbadge,.mortbadge').forEach(e=>e.remove());
    div.classList.remove('owned');
    div.style.removeProperty('--owner-color');
    if(ts && ts.owner!=null){
      const owner = G.players.find(p=>p.id===ts.owner);
      div.classList.add('owned');
      div.style.setProperty('--owner-color', owner ? owner.color : '#fff');
      if(ts.mortgaged){
        const m = document.createElement('div'); m.className='mortbadge'; m.textContent='저당'; div.appendChild(m);
      } else if(ts.landmark){
        const b = document.createElement('div'); b.className='lvbadge'; b.textContent='★랜드마크'; div.appendChild(b);
      } else if(ts.level>0){
        const b = document.createElement('div'); b.className='lvbadge'; b.textContent=LEVEL_LABEL[ts.level]; div.appendChild(b);
      }
    }
  });
}

function renderTokens(hoppingId){
  const layer = document.getElementById('tokensLayer');
  layer.innerHTML = '';
  const offsets = [[18,18],[62,18],[18,62],[62,62]];
  G.players.forEach((p,pi)=>{
    if(p.bankrupt) return;
    const pos = tileGridPos(p.position);
    const tok = document.createElement('div');
    tok.className = 'token' + (p.id===hoppingId ? ' hop' : '');
    tok.style.background = p.color;
    tok.textContent = p.token;
    const colW = 100/11, rowH = 100/11;
    const left = (pos.col-1)*colW + offsets[pi][0]*colW/100*0.9;
    const top = (pos.row-1)*rowH + offsets[pi][1]*rowH/100*0.9;
    tok.style.left = left + '%';
    tok.style.top = top + '%';
    layer.appendChild(tok);
  });
}

let expandedPanels = {};

    if(!p.human) badges.push('AI');
    const myProps = TILES.map((t,i)=>({t,i})).filter(x=>G.tileState[x.i] && G.tileState[x.i].owner===p.id);
    card.innerHTML = `
      <div class="pc-head">
        <div class="pc-token">${p.token}</div>

      <div class="pc-props ${expandedPanels[p.id]?'':'hidden'}" id="props-${p.id}"></div>

      myProps.forEach(({t,i})=>{
        const ts = G.tileState[i];

        const canBuild = canManage && t.type==='city' && !ts.mortgaged;
        const canMortgage = canManage && !ts.mortgaged && ts.level===0 && !ts.landmark;

          ${canUnmortgage?`<button data-unmortgage="${i}">저당 해제</button>`:''}
        `;

function rollTwo(){
  const a = 1+Math.floor(Math.random()*6);
  const b = 1+Math.floor(Math.random()*6);
  return {a,b,total:a+b,isDouble:a===b};
}

function moveForward(player, steps, grantBonus){
  let newPos = player.position + steps;
  if(newPos>=40){
    newPos -= 40;
    if(grantBonus){ player.cash += PASS_GO_BONUS; log(`${player.name}님이 출발 지점을 지나 ${FMT(PASS_GO_BONUS)}를 받았습니다.`); }
  }
  player.position = newPos;
  if(newPos===0 && grantBonus){ player.cash += PASS_GO_BONUS; log(`${player.name}님이 출발 지점에 정확히 도착해 보너스 ${FMT(PASS_GO_BONUS)}를 추가로 받았습니다!`); }
}
function moveBackward(player, steps){
  player.position = (player.position - steps + 40) % 40;
}
function teleportTo(player, idx){
  player.position = idx;
}

========================================================= */
async function doRoll(){
  const p = currentPlayer();
  if(!p || p.bankrupt) return;
  if(!canIControl(p)) return;
  if(p.inIsland){ return; } // handled via island modal
  G.phase = 'moving';
  renderButtons();
  const d = rollTwo();
  await animateDiceRoll();
  settleDice(d.a, d.b);
  await sleep(220);

  if(d.isDouble){ p.consecDoubles++; } else { p.consecDoubles = 0; }
  log(`${p.name}님이 주사위 ${d.a}, ${d.b} (합계 ${d.total})을 굴렸습니다.`);

  if(p.consecDoubles>=3){
    p.consecDoubles = 0;
    log(`${p.name}님, 더블이 3번 연속! 무인도로 보내집니다.`);
    sendToIsland(p);
    renderAll();
    await endOfAction(p, false);
    return;
  }

  const startPos = p.position;
  const steps = d.total;
  for(let s=1;s<=steps;s++){
    p.position = (startPos + s) % 40;
    renderTokens(p.id);
    await sleep(190);
  }
  if(startPos + steps >= 40){ p.cash += PASS_GO_BONUS; log(`${p.name}님이 출발 지점을 지나 ${FMT(PASS_GO_BONUS)}를 받았습니다.`); }
  if(p.position===0){ p.cash += PASS_GO_BONUS; log(`${p.name}님이 출발 지점에 정확히 도착해 보너스를 추가로 받았습니다!`); }
  renderAll();

  await resolveLanding(p, d.isDouble);
}

async function resolveLanding(player, isDouble){
  const i = player.position;
  const t = TILES[i];
  log(`${player.name}님이 [${t.icon} ${t.name}] 칸에 도착했습니다.`);
  renderAll();

  if(t.type==='go' || t.type==='chance' && false){ /* noop */ }

  if(t.type==='city' || t.type==='airport' || t.type==='utility'){
    await resolvePropertyLanding(player, i, t);
  } else if(t.type==='chance'){
    await drawGoldenKey(player);
  } else if(t.type==='tax'){
    await resolveTax(player, t);
  } else if(t.type==='island'){
    sendToIsland(player);
  } else if(t.type==='worldtour'){
    await resolveWorldTour(player);
  } else if(t.type==='socialfund'){
    if(G.pot>0){ log(`${player.name}님이 사회복지기금 ${FMT(G.pot)}를 모두 받았습니다!`); player.cash += G.pot; G.pot = 0; }
    else{ log('사회복지기금이 비어있습니다.'); }
  } else if(t.type==='go'){
    // nothing extra
  }
  renderAll();
  await endOfAction(player, isDouble);
}

async function endOfAction(player, isDouble){
  checkBankruptAndRemove();
  if(checkWinByElimination()) return;
  if(player.bankrupt){ await nextTurn(); return; }
  if(player.inIsland){ await nextTurn(); return; }
  if(isDouble){
    log(`${player.name}님, 더블이라 한 번 더 굴릴 수 있습니다!`);
    G.phase = 'idle';
    renderAll();
    if(!player.human){ await sleep(500); await aiTakeTurn(player); }
    return;
  }
  G.phase = player.human ? 'postroll' : 'idle';
  renderAll();
  if(!player.human){ await sleep(400); await aiMaybeBuild(player); await sleep(300); await nextTurn(); }
  else{ autoAdvanceTurn(player); }
}

async function autoAdvanceTurn(player){
  await sleep(1600);
  for(let i=0;i<16;i++){
    const cp = currentPlayer();
    if(G.phase!=='postroll' || !cp || cp.id!==player.id) return;
    const modalOpen = document.getElementById('modalRoot').children.length>0;
    if(!modalOpen){ await nextTurn(); return; }
    await sleep(500);
  }
}

document.getElementById('rollBtn').addEventListener('click', ()=>{ if(G && G.phase==='idle' && canIControl(currentPlayer())) doRoll(); });
document.getElementById('endTurnBtn').addEventListener('click', async ()=>{
  const p = currentPlayer();
  if(p && canIControl(p) && G.phase==='postroll'){ await nextTurn(); }
});

async function nextTurn(){
  const prevIdx = G.turnIdx;
  let tries = 0;
  do{
    G.turnIdx = (G.turnIdx+1) % G.players.length;
    tries++;
    if(G.turnIdx===0) G.lap++;
  } while(G.players[G.turnIdx].bankrupt && tries<=G.players.length+1);

  if(checkGameEndByLaps()) return;

  const p = currentPlayer();
  p.consecDoubles = 0;
  G.phase = 'idle';
  renderAll();
  maybeDriveTurn();
}

function maybeAutoplay(){
  maybeDriveTurn();
}

/* =========================================================
   PROPERTY LANDING (buy / pay toll)
========================================================= */
async function resolvePropertyLanding(player, i, t){
  const ts = G.tileState[i];
  if(ts.owner==null){
    if(player.human){ await showBuyModal(player, i, t); }
    else{ aiHandleBuy(player, i, t); }
    return;
  }
  if(ts.owner===player.id) return; // own property, nothing happens
  if(ts.mortgaged) { log(`${t.name}은 저당 중이라 통행료가 없습니다.`); return; }
  const owner = G.players.find(p=>p.id===ts.owner);
  let toll = 0;
  if(t.type==='city'){
    toll = t.price * LEVEL_MULT[ts.level];
    if(ts.landmark) toll = t.price * LANDMARK_MULT;
    else if(ts.level===0 && ownsFullGroup(owner, t.group)) toll *= 2;
  } else if(t.type==='airport'){
    toll = AIRPORT_RENT[playerOwnedAirports(owner)] || 0;
  } else if(t.type==='utility'){
    const diceSum = G.dice[0]+G.dice[1];
    const cnt = playerOwnedUtilities(owner);
    toll = diceSum * (cnt>=2 ? 500000 : 200000);
  }
  log(`${player.name}님이 ${owner.name}님에게 통행료 ${FMT(toll)}를 지불합니다.`);
  await payOut(player, toll, owner);
}

async function showBuyModal(player, i, t){
  return new Promise(resolve=>{
    openModal(`
      <h3>${t.icon} ${t.name}</h3>
      <p>이 땅은 주인이 없습니다. 가격: <b>${FMT(t.price)}</b></p>
      <p>현재 보유 현금: ${FMT(player.cash)}</p>
      <div class="mrow">
        <button class="neutral" id="mSkip">구매 안함</button>
        <button class="good" id="mBuy" ${player.cash<t.price?'disabled':''}>구매하기</button>
      </div>
    `);
    document.getElementById('mSkip').onclick = ()=>{ closeModal(); resolve(); };
    document.getElementById('mBuy').onclick = ()=>{
      player.cash -= t.price;
      G.tileState[i].owner = player.id;
      log(`${player.name}님이 ${t.name}을 ${FMT(t.price)}에 구매했습니다.`);
      closeModal(); renderAll(); resolve();
    };
  });
}

function aiHandleBuy(player, i, t){
  const buffer = t.type==='city' ? START_POS_BUFFER : 1000000;
  if(player.cash - t.price >= buffer){
    player.cash -= t.price;
    G.tileState[i].owner = player.id;
    log(`${player.name}님이 ${t.name}을 ${FMT(t.price)}에 구매했습니다.`);
  } else {
    log(`${player.name}님이 ${t.name} 구매를 포기했습니다.`);
  }
}

  document.getElementById('mPay').onclick = async ()=>{ closeModal(); player.cash -= ISLAND_ESCAPE_FEE; G.pot += ISLAND_ESCAPE_FEE; player.inIsland=false; log(`${player.name}님이 ${FMT(ISLAND_ESCAPE_FEE)}를 내고 무인도를 탈출했습니다.`); G.phase='idle'; renderAll(); };

async function islandDiceTry(player, interactive){
  const d = rollTwo();
  await animateDiceRoll();
  settleDice(d.a, d.b);
  await sleep(220);
  if(d.isDouble){
    player.inIsland = false;
    log(`${player.name}님이 더블(${d.a},${d.a})을 굴려 무인도를 탈출했습니다!`);
    G.phase = 'moving';
    renderAll();
    const startPos = player.position;
    for(let s=1;s<=d.total;s++){ player.position=(startPos+s)%40; renderTokens(player.id); await sleep(190); }
    if(startPos+d.total>=40){ player.cash+=PASS_GO_BONUS; log(`${player.name}님이 출발 지점을 지나 보너스를 받았습니다.`); }
    renderAll();
    await resolveLanding(player, false);
  } else {
    player.islandTurns++;
    log(`${player.name}님이 탈출에 실패했습니다. (${d.a}, ${d.b})`);
    if(player.islandTurns>=ISLAND_MAX_STUCK_TURNS){
      player.inIsland = false;
      log(`${player.name}님이 ${ISLAND_MAX_STUCK_TURNS}턴을 쉬어 무인도에서 풀려났습니다.`);
    }
    G.phase = 'idle';
    renderAll();
    await nextTurn();
  }
}

async function aiHandleIsland(player){
  if(player.escapeCards>0){ player.escapeCards--; player.inIsland=false; log(`${player.name}님이 탈출카드를 사용했습니다.`); G.phase='idle'; renderAll(); await aiTakeTurn(player); return; }
  if(player.cash >= ISLAND_ESCAPE_FEE + 2000000){
    player.cash -= ISLAND_ESCAPE_FEE; G.pot += ISLAND_ESCAPE_FEE; player.inIsland=false;
    log(`${player.name}님이 돈을 내고 무인도를 탈출했습니다.`);
    G.phase='idle'; renderAll(); await aiTakeTurn(player);
    return;
  }
  await islandDiceTry(player, false);
}

        <div class="dest-grid">${options.map(x=>`<button data-go="${x.i}" ${player.cash<WORLDTOUR_FEE?'disabled':''}>${x.t.icon} ${x.t.name}</button>`).join('')}</div>
        <div class="mrow"><button class="neutral" id="mSkip">여행 포기</button></div>
      `);

          player.cash -= WORLDTOUR_FEE;

          await resolveLanding(player, false);
          resolve();
        };

function openBuildModal(i){
  const t = TILES[i]; const ts = G.tileState[i]; const player = currentPlayer();
  if(ts.owner!==player.id) return;
  const fullGroup = ownsFullGroup(player, t.group);
  let body = `<h3>🏗️ ${t.name} 건설</h3>`;
  if(!fullGroup){
    body += `<p>이 대륙(${groupOf(t.group).name})의 도시를 모두 소유해야 건물을 지을 수 있습니다.</p><div class="mrow"><button class="neutral" id="mClose">닫기</button></div>`;
    openModal(body);
    document.getElementById('mClose').onclick = closeModal;
    return;
  }
  if(ts.mortgaged){
    body += `<p>저당 중인 땅에는 건설할 수 없습니다. 먼저 저당을 해제하세요.</p><div class="mrow"><button class="neutral" id="mClose">닫기</button></div>`;
    openModal(body);
    document.getElementById('mClose').onclick = closeModal;
    return;
  }
  const canLandmark = ts.level===3 && !ts.landmark && groupTiles(t.group).every(gi=>G.tileState[gi].level===3 && G.tileState[gi].owner===player.id) && !groupTiles(t.group).some(gi=>G.tileState[gi].landmark);
  if(ts.landmark){
    body += `<p>이미 ★랜드마크가 세워져 있습니다. 최고 단계입니다!</p>`;
  } else if(ts.level<3){
    const cost = Math.round(t.price*BUILD_COST_MULT[ts.level]);
    const nextLabel = LEVEL_LABEL[ts.level+1];
    body += `<p>현재 단계: ${LEVEL_LABEL[ts.level]}</p><p>다음 단계(${nextLabel}) 건설 비용: ${FMT(cost)}</p>`;
    body += `<div class="mrow"><button class="good" id="mBuild" ${player.cash<cost?'disabled':''}>${nextLabel} 짓기</button><button class="neutral" id="mClose">닫기</button></div>`;
  } else if(canLandmark){
    const cost = Math.round(t.price*BUILD_COST_MULT[3]);
    body += `<p>이 대륙의 모든 도시가 호텔입니다! 이곳에 ★랜드마크를 세울 수 있습니다.</p><p>건설 비용: ${FMT(cost)}</p>`;
    body += `<div class="mrow"><button class="good" id="mLandmark" ${player.cash<cost?'disabled':''}>★랜드마크 짓기</button><button class="neutral" id="mClose">닫기</button></div>`;
  } else {
    body += `<p>호텔 단계입니다. 대륙 내 다른 도시도 모두 호텔이 되면 랜드마크를 지을 수 있습니다.</p><div class="mrow"><button class="neutral" id="mClose">닫기</button></div>`;
  }
  openModal(body);
  const closeBtn = document.getElementById('mClose'); if(closeBtn) closeBtn.onclick = closeModal;
  const buildBtn = document.getElementById('mBuild');
  if(buildBtn) buildBtn.onclick = ()=>{
    const cost = Math.round(t.price*BUILD_COST_MULT[ts.level]);
    player.cash -= cost; ts.level++;
    log(`${player.name}님이 ${t.name}에 ${LEVEL_LABEL[ts.level]}을 건설했습니다. (${FMT(cost)})`);
    closeModal(); renderAll();
  };
  const lmBtn = document.getElementById('mLandmark');
  if(lmBtn) lmBtn.onclick = ()=>{
    const cost = Math.round(t.price*BUILD_COST_MULT[3]);
    player.cash -= cost; ts.landmark = true;
    log(`${player.name}님이 ${t.name}에 ★랜드마크를 건설했습니다! (${FMT(cost)})`);
    closeModal(); renderAll();
  };
}

function doMortgage(i){
  const t = TILES[i]; const ts = G.tileState[i]; const player = currentPlayer();
  if(ts.owner!==player.id || ts.mortgaged || ts.level>0 || ts.landmark) return;
  const amt = Math.round(t.price*MORTGAGE_RATE);
  ts.mortgaged = true;
  player.cash += amt;
  log(`${player.name}님이 ${t.name}을 저당 잡혀 ${FMT(amt)}를 받았습니다.`);
  renderAll();
}
function doUnmortgage(i){
  const t = TILES[i]; const ts = G.tileState[i]; const player = currentPlayer();
  if(ts.owner!==player.id || !ts.mortgaged) return;
  const amt = Math.round(t.price*MORTGAGE_RATE*UNMORTGAGE_INTEREST);
  if(player.cash<amt){ return; }
  player.cash -= amt;
  ts.mortgaged = false;
  log(`${player.name}님이 ${t.name}의 저당을 해제했습니다. (${FMT(amt)})`);
  renderAll();
}

async function aiMaybeBuild(player){
  for(let attempt=0; attempt<3; attempt++){
    let didSomething = false;
    for(const gr of GROUPS){
      if(!ownsFullGroup(player, gr.id)) continue;
      const tiles = groupTiles(gr.id).map(i=>({i, t:TILES[i], ts:G.tileState[i]})).filter(x=>!x.ts.mortgaged);
      // build landmark opportunity
      const allHotel = tiles.every(x=>x.ts.level===3) && !tiles.some(x=>x.ts.landmark) && tiles.length>0;
      if(allHotel){
        const target = tiles[0];
        const cost = Math.round(target.t.price*BUILD_COST_MULT[3]);
        if(player.cash - cost >= 2000000){
          player.cash -= cost; target.ts.landmark = true;
          log(`${player.name}님이 ${target.t.name}에 ★랜드마크를 건설했습니다.`);
          didSomething = true; continue;
        }
      }
      // else raise the cheapest-to-upgrade tile
      const upgradable = tiles.filter(x=>x.ts.level<3 && !x.ts.landmark).sort((a,b)=>a.ts.level-b.ts.level);
      if(upgradable.length){
        const target = upgradable[0];
        const cost = Math.round(target.t.price*BUILD_COST_MULT[target.ts.level]);
        if(player.cash - cost >= 3000000){
          player.cash -= cost; target.ts.level++;
          log(`${player.name}님이 ${target.t.name}에 ${LEVEL_LABEL[target.ts.level]}을 건설했습니다.`);
          didSomething = true;
        }
      }
    }
    if(!didSomething) break;
    renderAll();
    await sleep(250);
  }
}

/* =========================================================
   PAYMENT / BANKRUPTCY
========================================================= */
async function payOut(payer, amount, creditor){
  amount = Math.round(amount);
  if(payer.cash >= amount){
    payer.cash -= amount;
    if(creditor) creditor.cash += amount; else G.pot += amount;
    return true;
  }
  // need to raise funds
  if(payer.human){
    await handleShortfallHuman(payer, amount, creditor);
  } else {
    handleShortfallAI(payer, amount, creditor);
  }
  return payer.cash >= 0;
}

function unmortgagedOwnedSorted(player){
  return TILES.map((t,i)=>({t,i,ts:G.tileState[i]})).filter(x=>x.ts && x.ts.owner===player.id && !x.ts.mortgaged && x.ts.level===0 && !x.ts.landmark)
    .sort((a,b)=>a.t.price-b.t.price);
}

function handleShortfallAI(payer, amount, creditor){
  let need = amount - payer.cash;
  const mortgageable = unmortgagedOwnedSorted(payer);
  for(const x of mortgageable){
    if(need<=0) break;
    const amt = Math.round(x.t.price*MORTGAGE_RATE);
    x.ts.mortgaged = true; payer.cash += amt; need -= amt;
    log(`${payer.name}님이 ${x.t.name}을 저당 잡혔습니다. (${FMT(amt)})`);
  }
  if(payer.cash >= amount){ payer.cash -= amount; if(creditor) creditor.cash += amount; else G.pot += amount; }
  else{ declareBankrupt(payer, creditor); }
}

async function handleShortfallHuman(payer, amount, creditor){
  return new Promise(resolve=>{
    function render(){
      const need = amount - payer.cash;
      const props = unmortgagedOwnedSorted(payer);
      let body = `<h3>⚠️ 자금 부족</h3><p>${FMT(amount)}를 지불해야 하지만 현금이 ${FMT(payer.cash)}뿐입니다. 부족분: ${FMT(Math.max(0,need))}</p>`;
      if(props.length){
        body += `<p>땅을 저당 잡혀 현금을 마련할 수 있습니다:</p><div class="dest-grid">`;
        props.forEach(x=>{ body += `<button data-mg="${x.i}">${x.t.name}<br>+${FMT(Math.round(x.t.price*MORTGAGE_RATE))}</button>`; });
        body += `</div>`;
      } else {
        body += `<p>저당 잡힐 수 있는 땅이 없습니다.</p>`;
      }
      body += `<div class="mrow">
        <button class="good" id="mPayNow" ${payer.cash<amount?'disabled':''}>지금 지불</button>
        <button class="bad" id="mBankrupt">파산 선언</button>
      </div>`;
      openModal(body);
      document.querySelectorAll('[data-mg]').forEach(b=>{
        b.onclick = ()=>{
          const i = +b.dataset.mg; const t=TILES[i]; const ts=G.tileState[i];
          const amt = Math.round(t.price*MORTGAGE_RATE);
          ts.mortgaged = true; payer.cash += amt;
          log(`${payer.name}님이 ${t.name}을 저당 잡혔습니다. (${FMT(amt)})`);
          renderAll(); render();
        };
      });
      document.getElementById('mPayNow').onclick = ()=>{
        payer.cash -= amount;
        if(creditor) creditor.cash += amount; else G.pot += amount;
        closeModal(); renderAll(); resolve();
      };
      document.getElementById('mBankrupt').onclick = ()=>{
        closeModal(); declareBankrupt(payer, creditor); renderAll(); resolve();
      };
    }
    render();
  });
}

function declareBankrupt(player, creditor){
  log(`💀 ${player.name}님이 파산했습니다!`);
  player.bankrupt = true;
  TILES.forEach((t,i)=>{
    const ts = G.tileState[i];
    if(ts && ts.owner===player.id){
      if(creditor && !creditor.bankrupt){
        ts.owner = creditor.id;
        log(`${t.name}이 ${creditor.name}님에게 넘어갔습니다.`);
      } else {
        ts.owner = null; ts.level = 0; ts.mortgaged=false; ts.landmark=false;
        log(`${t.name}이 은행으로 반환되었습니다.`);
      }
    }
  });
  if(creditor) creditor.cash += Math.max(0, player.cash);
  player.cash = 0;
}

  // placeholder for future chained checks; bankruptcy itself is handled at payOut time
}

function checkWinByElimination(){
  const alive = activePlayers();
  if(alive.length<=1 && G.players.length>1){
    showGameOver(alive);
    return true;
  }
  return false;
}

function checkGameEndByLaps(){
  if(G.maxLaps>0 && G.lap>=G.maxLaps){
    showGameOver(activePlayers());
    return true;
  }
  return false;
}

function showGameOver(alive){
  const ranking = [...G.players].sort((a,b)=>{
    if(a.bankrupt!==b.bankrupt) return a.bankrupt?1:-1;
    return netWorth(b)-netWorth(a);
  });
  let body = `<h3>🏆 게임 종료!</h3>`;
  ranking.forEach((p,idx)=>{
    body += `<div class="gameover-rank"><div class="rk">${idx+1}</div><div>${p.token} <b>${p.name}</b>${p.bankrupt?' (파산)':''}</div><div style="margin-left:auto;font-weight:700;">${FMT(netWorth(p))}</div></div>`;
  });
  body += `<div class="mrow"><button class="primary" id="mNew">새 게임 시작</button></div>`;
  openModal(body);
  document.getElementById('mNew').onclick = ()=>{ localStorage.removeItem(SAVE_KEY); closeModal(); location.reload(); };
  G.phase = 'gameover';
  saveGame();
}

/* =========================================================
   AI TURN LOOP
========================================================= */
async function aiTakeTurn(player){
  if(player.bankrupt) return;
  if(G.phase==='gameover') return;
  if(player.inIsland){ await aiHandleIsland(player); return; }
  G.phase = 'idle';
  await sleep(300);
  await doRoll();
}

if(existingRoom){
